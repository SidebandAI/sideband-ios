name: Publish release archive

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Package CocoaPods source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi

          asset="Sideband-CocoaPods-$TAG.zip"
          staging=".build/cocoapods-release"
          rm -rf "$staging"
          mkdir -p "$staging/Sources"

          unzip -q Sideband.xcframework.zip -d "$staging"
          cp -R Sources/SidebandWebView "$staging/Sources/SidebandWebView"

          test -d "$staging/Sideband.xcframework"
          test -f "$staging/Sources/SidebandWebView/SidebandWebViewBridge.swift"

          (
            cd "$staging"
            zip -qry "../../$asset" Sideband.xcframework Sources/SidebandWebView
          )
          sha256sum "$asset" > "$asset.sha256"

          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
            exit 0
          fi

          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$ASSET" \
            "$ASSET.sha256" \
            --verify-tag \
            --title "Sideband $TAG" \
            --generate-notes \
            "${release_flags[@]}"
